x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    container_name: camper-booking-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camper-booking-backend
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    networks:
      - internal
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MODE: production
    container_name: camper-booking-frontend
    restart: unless-stopped
    networks:
      - internal
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
